name: Deploy

# Production deploy of https://unlock.zuey.me. Runs only from main, after the same gates as CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run content:check
      - run: bun run migrations:check
      - run: bun run test
      - run: bun run build
      # Rollback point: D1 Time Travel can restore the database to this bookmark (docs/deployment.md).
      # Only the bookmark and a timestamp are printed; the API token stays in the environment.
      - name: Record D1 time-travel bookmark
        run: |
          taken_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          info=$(bunx wrangler d1 time-travel info unlock_zuey_me_db --json)
          bookmark=$(printf '%s' "$info" | jq -r '.bookmark // empty')
          if [ -z "$bookmark" ]; then
            echo "::error::could not read a D1 time-travel bookmark; not migrating without a rollback point"
            exit 1
          fi
          echo "D1 bookmark before migrations ($taken_at): $bookmark"
          {
            echo "### D1 rollback point"
            echo ""
            echo "- Taken at: \`$taken_at\` (before \`d1 migrations apply\`, commit \`$GITHUB_SHA\`)"
            echo "- Bookmark: \`$bookmark\`"
            echo "- Restore: \`bunx wrangler d1 time-travel restore unlock_zuey_me_db --bookmark=$bookmark\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply unlock_zuey_me_db --remote
      - name: Deploy worker
        run: bunx wrangler deploy
      - name: Sync OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | bunx wrangler secret put OPENROUTER_API_KEY
          fi
      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://unlock.zuey.me/api/health) && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "health check failed (last status $code)"; exit 1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Production E2E
        env:
          E2E_BASE_URL: https://unlock.zuey.me
        run: bun run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .e2e/report/
          retention-days: 14
