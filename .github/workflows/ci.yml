name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Content schema gate
        run: bun run content:check
      - name: Migration safety gate (expand/contract, docs/deployment.md)
        run: bun run migrations:check
      - name: Unit tests
        run: bun run test
      - name: Type-check and build
        run: bun run build
